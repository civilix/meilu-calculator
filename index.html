<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd98c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="收益计算器">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>收益计算器</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell" aria-labelledby="appTitle">
    <header class="app-header">
      <div class="brand-lockup">
        <img class="brand-mark" src="icons/icon.svg" alt="" width="44" height="44" aria-hidden="true">
        <div>
          <p class="eyebrow">Mercari Pricing</p>
          <h1 id="appTitle">收益计算器</h1>
        </div>
      </div>
      <div class="fee-badge">
        <span>平台手数料</span>
        <strong>10%</strong>
      </div>
    </header>

    <section class="calculator" aria-label="收益计算">
      <div class="field-card">
        <div class="field-heading">
          <label for="purchasePrice">购入成本</label>
          <div class="segmented-control" aria-label="成本币种">
            <button type="button" class="segment-button active" data-currency="CNY" aria-pressed="true">元</button>
            <button type="button" class="segment-button" data-currency="JPY" aria-pressed="false">円</button>
          </div>
        </div>
        <div class="input-row">
          <input type="number" id="purchasePrice" name="purchasePrice" min="0" step="1" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0">
          <span class="input-unit" id="purchasePriceUnit">元</span>
        </div>
        <p class="helper-text" id="exchangeRateInfo" aria-live="polite"></p>
      </div>

      <div class="field-card">
        <label for="sellingPrice">贩卖价格</label>
        <div class="input-row">
          <input type="number" id="sellingPrice" name="sellingPrice" min="0" step="1" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="300">
          <span class="input-unit">円</span>
        </div>
      </div>

      <div class="field-card">
        <div class="field-heading">
          <span class="field-label">邮寄方式</span>
          <span class="shipping-source">送料 2026-06-12</span>
        </div>
        <div class="shipping-options" id="shippingOptions" aria-label="邮寄方式">
          <button type="button" class="shipping-button active" data-shipping="mini" aria-pressed="true">
            <span>mini</span>
            <strong>180円</strong>
          </button>
          <button type="button" class="shipping-button" data-shipping="post" aria-pressed="false">
            <span>ポスト</span>
            <strong>220円</strong>
          </button>
          <button type="button" class="shipping-button" data-shipping="plus" aria-pressed="false">
            <span>プラス</span>
            <strong>520円</strong>
          </button>
          <button type="button" class="shipping-button" data-shipping="delivery60" aria-pressed="false">
            <span>宅配60</span>
            <strong>750円</strong>
          </button>
          <button type="button" class="shipping-button" data-shipping="delivery80" aria-pressed="false">
            <span>宅配80</span>
            <strong>870円</strong>
          </button>
          <button type="button" class="shipping-button" data-shipping="delivery120" aria-pressed="false">
            <span>宅配120</span>
            <strong>1200円</strong>
          </button>
        </div>
        <p class="helper-text" id="shippingDetail">送料160円 + 専用封筒20円</p>
      </div>

      <div class="field-card">
        <span class="field-label">目标利润率</span>
        <div class="profit-options" aria-label="目标利润率">
          <button type="button" class="profit-button" data-target-margin="20" aria-pressed="false">20%</button>
          <button type="button" class="profit-button" data-target-margin="30" aria-pressed="false">30%</button>
          <button type="button" class="profit-button" data-target-margin="40" aria-pressed="false">40%</button>
          <button type="button" class="profit-button" data-target-margin="50" aria-pressed="false">50%</button>
        </div>
      </div>
    </section>

    <section class="result-card" id="result" aria-live="polite">
      <div class="result-primary">
        <span>预估收益</span>
        <strong><span id="profitJPY">--</span>円</strong>
        <em id="profitCNY"></em>
      </div>
      <div class="result-grid">
        <div>
          <span>利润率</span>
          <strong><span id="profitMargin">--</span>%</strong>
        </div>
        <div>
          <span>手续费</span>
          <strong><span id="feeJPY">--</span>円</strong>
        </div>
        <div>
          <span>运费</span>
          <strong><span id="shippingJPY">180</span>円</strong>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
